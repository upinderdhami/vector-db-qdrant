[project]
name = "vector-db-qdrant"
version = "0.1.0"
description = "Hyperskill: Vector Database with Qdrant (arxiv semantic search)"
requires-python = ">=3.11,<4.0"
dependencies = [
    "qdrant-client>=1.12.0,<2.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

# Workday laptop: public PyPI (files.pythonhosted.org) is blocked — use Artifactory.
# Comment this block out if you ever need installs from public PyPI off-corp network.
[[tool.poetry.source]]
name = "workday-pypi"
url = "https://artifactory.workday.com/artifactory/api/pypi/pypi.python.org2/simple"
priority = "primary"
